import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The release key comes from the environment, never from the clone; the build is signed only when
// RELEASE_KEYSTORE_FILE is set. A blank value counts as unset: a missing secret passes one.
def releaseKeystoreFile = System.getenv("RELEASE_KEYSTORE_FILE")?.trim()

// versionCode is major * 10000 + minor * 100 + patch: a later version always has a higher code,
// which Android needs to accept an update.
def appVersion = "${new JsonSlurper().parse(rootProject.file("../package.json")).version}".toString()
if (!(appVersion ==~ /(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)/)) {
    throw new GradleException("apps/gui/package.json: version must be MAJOR.MINOR.PATCH, not ${appVersion}")
}
def (major, minor, patch) = appVersion.tokenize(".")*.toInteger()
def appVersionCode = major * 10000 + minor * 100 + patch
if (minor > 99 || patch > 99 || appVersionCode > 2100000000) {
    throw new GradleException("apps/gui/package.json: version ${appVersion} has no versionCode: minor and patch go up to 99, and the code to 2100000000")
}

android {
    namespace = "com.hicirtech.taikohiroba"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hicirtech.taikohiroba"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Debug has an applicationIdSuffix, so both builds install; the label tells them apart.
        manifestPlaceholders = [appLabel: "@string/app_name"]
        aaptOptions {
            // aapt's default ignore list, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystoreFile) {
                storeFile file(releaseKeystoreFile)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            manifestPlaceholders = [appLabel: "A Better Taiko Hiroba (debug)"]
        }
        release {
            if (releaseKeystoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
