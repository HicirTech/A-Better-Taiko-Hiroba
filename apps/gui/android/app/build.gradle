import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The signing keys are kept outside the clone, in the folder ABTH_RELEASE_KEYS names, as in
// scripts/release-keys.ts. Without it the release build is unsigned and the debug build uses this
// machine's own debug key.
def keysFolderGiven = System.getenv("ABTH_RELEASE_KEYS")
def keysFolder = keysFolderGiven?.trim() ? new File(keysFolderGiven) : null
if (keysFolder != null && !keysFolder.isAbsolute()) {
    throw new GradleException("ABTH_RELEASE_KEYS must be an absolute path, and is \"${keysFolderGiven}\".")
}
def keystorePropertiesFile = keysFolder == null ? null : new File(keysFolder, "keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile?.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def debugKeystoreFile = keysFolder == null ? null : new File(keysFolder, "debug.keystore")

// The version has one source, "version" in apps/gui/package.json, which electron-builder reads too.
// versionName is that text. versionCode is major * 10000 + minor * 100 + patch, so 0.1.0 is 100 and
// a later version always has a higher code, which Android needs to accept an update. That holds only
// while minor and patch stay below 100, and the code stays within Android's limit of 2100000000.
// scripts/release-version.ts has the same rules, and its tests read this file.
def appVersion = "${new JsonSlurper().parse(rootProject.file("../package.json")).version}".toString()
if (!(appVersion ==~ /(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)/)) {
    throw new GradleException("apps/gui/package.json: version must be MAJOR.MINOR.PATCH, not ${appVersion}")
}
def (major, minor, patch) = appVersion.tokenize(".")*.toInteger()
def appVersionCode = major * 10000 + minor * 100 + patch
if (minor > 99 || patch > 99 || appVersionCode > 2100000000) {
    throw new GradleException("apps/gui/package.json: version ${appVersion} has no versionCode: minor and patch go up to 99, and the code to 2100000000")
}

android {
    namespace = "com.hicirtech.taikohiroba"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hicirtech.taikohiroba"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The launcher label. Debug carries an applicationIdSuffix, so both builds install side by
        // side; the placeholder tells their home-screen entries apart.
        manifestPlaceholders = [appLabel: "@string/app_name"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // The shared debug key, with Android's standard debug credentials.
            if (debugKeystoreFile?.exists()) {
                storeFile debugKeystoreFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            if (keystorePropertiesFile?.exists()) {
                storeFile new File(keysFolder, keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            manifestPlaceholders = [appLabel: "A Better Taiko Hiroba (debug)"]
        }
        release {
            if (keystorePropertiesFile?.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
