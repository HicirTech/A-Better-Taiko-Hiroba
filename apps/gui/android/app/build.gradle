import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The release key comes from the environment, so it never has to be in the clone: the release
// workflow sets RELEASE_KEYSTORE_FILE (the keystore's path), RELEASE_KEYSTORE_PASSWORD,
// RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD. The release build is signed when
// RELEASE_KEYSTORE_FILE is set and left unsigned when it is not. A blank value counts as not set,
// which is what a step passes for a secret that does not exist.
def releaseKeystoreFile = System.getenv("RELEASE_KEYSTORE_FILE")?.trim()

// The version has one source, "version" in apps/gui/package.json, which electron-builder reads too.
// versionName is that text. versionCode is major * 10000 + minor * 100 + patch, so 0.1.0 is 100 and
// a later version always has a higher code, which Android needs to accept an update. That holds only
// while minor and patch stay below 100, and the code stays within Android's limit of 2100000000.
def appVersion = "${new JsonSlurper().parse(rootProject.file("../package.json")).version}".toString()
if (!(appVersion ==~ /(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)/)) {
    throw new GradleException("apps/gui/package.json: version must be MAJOR.MINOR.PATCH, not ${appVersion}")
}
def (major, minor, patch) = appVersion.tokenize(".")*.toInteger()
def appVersionCode = major * 10000 + minor * 100 + patch
if (minor > 99 || patch > 99 || appVersionCode > 2100000000) {
    throw new GradleException("apps/gui/package.json: version ${appVersion} has no versionCode: minor and patch go up to 99, and the code to 2100000000")
}

android {
    namespace = "com.hicirtech.taikohiroba"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hicirtech.taikohiroba"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The launcher label. Debug carries an applicationIdSuffix, so both builds install side by
        // side; the placeholder tells their home-screen entries apart.
        manifestPlaceholders = [appLabel: "@string/app_name"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystoreFile) {
                storeFile file(releaseKeystoreFile)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            manifestPlaceholders = [appLabel: "A Better Taiko Hiroba (debug)"]
        }
        release {
            if (releaseKeystoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
