name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run, except on main, where every commit's result is kept.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: keep in step with engines.bun in package.json.
          bun-version: 1.4.2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # Separate steps, so a red run names what broke.
      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The release's update.json, which the app reads: valid, and the version in gui/package.json.
      - name: Update feed
        run: bun run check:update-feed

      # The web bundle and Electron's main and preload; no Electron binary, packaging or Android.
      - name: Build GUI
        run: bun run --cwd gui build

  # Alongside Checks, not after it: the Android build shares nothing with it but the install.
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as the Checks job.
          bun-version: 1.4.2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Capacitor's CLI runs on Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          # bun.lock pins the Capacitor plugins whose Gradle files sit in node_modules.
          cache-dependency-path: |
            gui/android/**/*.gradle
            gui/android/gradle/wrapper/gradle-wrapper.properties
            bun.lock

      - name: Install
        run: bun install --frozen-lockfile

      # The runner's own Android SDK (ANDROID_HOME) has what the project builds against.
      - name: Build debug APK
        run: bun run --cwd gui android:apk
