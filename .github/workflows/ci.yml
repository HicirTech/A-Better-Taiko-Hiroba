name: CI

on:
  # Every branch, so a change is checked before it has a pull request. A filter on branches alone
  # leaves tags out: those belong to the release workflow.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless. Cancel it rather than pay for it,
# except on main, where every commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    # A pull request from this repository has its branch pushed here too, and that push has already
    # run these jobs on the same commit; running them again for the pull request would do the work
    # twice. A fork's pushes go to the fork, so its pull request is the only run it gets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not "latest": a toolchain that changes without a commit makes a green run
          # unrepeatable. Keep this in step with engines.bun in package.json.
          bun-version: 1.4.2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        # Frozen: CI resolves exactly what the lockfile says, or it fails. A run that silently
        # installs something else is not testing this commit.
        run: bun install --frozen-lockfile

      # Four separate steps rather than one combined command, so a red run names what broke
      # without anyone opening the log.
      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Both shells' bundles: the web app (Vite, run on this Bun) and Electron's main and preload
      # (Bun.build). No Electron binary, no packaging, no Android.
      - name: Build GUI
        run: bun run --cwd apps/gui build
