name: Release

# A real release is a push of a tag v<version>. Every other run is a dry run: a manual run, or a push
# to a branch that touches what a release is made of. It builds the same files and keeps them as
# artifacts of the run, and it creates no release.
run-name: ${{ github.event_name == 'push' && github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Release dry run on {0}', github.ref_name) }}

on:
  push:
    tags: ["v*.*.*"]
    branches: ["**"]
    # GitHub does not evaluate path filters for tags, so a tag always runs. For a branch, these are
    # what a release is made of: this file; the release script and its version rules; the app's
    # package.json, which holds the version and, under "build", electron-builder's configuration;
    # and the Android project.
    paths:
      - .github/workflows/release.yml
      - scripts/release.ts
      - scripts/release-version.ts
      - apps/gui/package.json
      - apps/gui/android/**
  workflow_dispatch:

# A newer push to a branch makes its older dry run pointless. A release is never cancelled half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  # Reads the version once for every job, and stops a tag that does not match it before anything is
  # built. Android and Windows both wait for it, and for nothing else.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: read
        run: |
          version=$(jq -r .version apps/gui/package.json)
          if ! [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error file=apps/gui/package.json::The version is \"$version\", and must be MAJOR.MINOR.PATCH."
            exit 1
          fi
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=true
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME, but apps/gui/package.json says $version, so the tag must be v$version. Nothing was built."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  android:
    name: Android release APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The same pin as in ci.yml: keep them in step.
          bun-version: 1.4.2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Capacitor's CLI runs on Node, and needs 22 (README, "What you need").
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          # As in ci.yml: JDK 21, Temurin, and a Gradle cache keyed on the Android project and bun.lock.
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            apps/gui/android/**/*.gradle
            apps/gui/android/gradle/wrapper/gradle-wrapper.properties
            bun.lock

      - name: Install
        run: bun install --frozen-lockfile

      # The release key is four secrets, written here into the two files build.gradle's signing
      # config reads (both git-ignored). They go in through the environment and into files, and are
      # never printed. A release without them fails; a dry run, which anyone with write access can
      # start, builds an unsigned APK instead.
      - name: Write the signing key
        id: key
        env:
          PUBLISH: ${{ needs.version.outputs.publish }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::A release is signed, and these secrets are not set:$missing. Add them as apps/gui/README.md (Releases) says, then re-run this run."
              exit 1
            fi
            echo "::warning::These secrets are not set:$missing. This dry run builds an unsigned release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          android=apps/gui/android
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$android/abth-release.jks"
          # A .properties file reads a backslash as an escape, so a password's own are doubled.
          escape() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            printf 'storeFile=%s\n' abth-release.jks
            printf 'storePassword=%s\n' "$(escape "$STORE_PASSWORD")"
            printf 'keyAlias=%s\n' "$(escape "$KEY_ALIAS")"
            printf 'keyPassword=%s\n' "$(escape "$KEY_PASSWORD")"
          } > "$android/keystore.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the signed release APK
        if: steps.key.outputs.signed == 'true'
        run: bun run --cwd apps/gui android:release

      - name: Build an unsigned release APK
        if: steps.key.outputs.signed == 'false'
        run: bun run --cwd apps/gui android:release-unsigned

      - name: Name the APK
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          mkdir dist
          out=apps/gui/android/app/build/outputs/apk/release
          if [ "$SIGNED" = true ]; then
            cp "$out/app-release.apk" "dist/ABTH-$VERSION.apk"
          else
            # Gradle names an APK it did not sign "unsigned", and so does this: it must not pass for a release.
            cp "$out/app-release-unsigned.apk" "dist/ABTH-$VERSION-unsigned.apk"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/ABTH-*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer and zip
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The same pin as in ci.yml: keep them in step.
          bun-version: 1.4.2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build GUI
        run: bun run --cwd apps/gui build

      # Both targets, x64, and no publishing: the release job publishes. Code signing is switched off
      # in the configuration ("signExecutable"), so none is tried and none is needed.
      - name: Package
        working-directory: apps/gui
        run: bunx electron-builder --win nsis zip --x64 --publish never

      # electron-builder names the files from the configuration; a name that came out otherwise
      # would be missing from the release, so look for the two by name before uploading.
      - name: Check the names
        shell: bash
        run: |
          ls -l apps/gui/release
          test -f "apps/gui/release/ABTH-$VERSION-setup.exe"
          test -f "apps/gui/release/ABTH-$VERSION-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/gui/release/ABTH-${{ needs.version.outputs.version }}-setup.exe
            apps/gui/release/ABTH-${{ needs.version.outputs.version }}-portable.zip
          if-no-files-found: error
          retention-days: 14
          # The files are compressed already.
          compression-level: 0

  # Only a tag run publishes; a dry run stops at its artifacts. The release is published, not a draft.
  release:
    name: Release
    if: needs.version.outputs.publish == 'true'
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$VERSION" --verify-tag --title "A Better Taiko Hiroba $VERSION" --generate-notes \
            "dist/ABTH-$VERSION.apk" \
            "dist/ABTH-$VERSION-setup.exe" \
            "dist/ABTH-$VERSION-portable.zip"
